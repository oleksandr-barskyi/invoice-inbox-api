name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python manage.py makemigrations --check --dry-run

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: invoices
          POSTGRES_USER: invoices
          POSTGRES_PASSWORD: invoices
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U invoices"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      POSTGRES_DB: ${{ matrix.database == 'postgres' && 'invoices' || '' }}
      POSTGRES_USER: invoices
      POSTGRES_PASSWORD: invoices
      POSTGRES_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest
